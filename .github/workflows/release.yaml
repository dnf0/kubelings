name: Kubelings Semantic Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Semantic Release & Publish
    if: ${{ ! endsWith(github.event.head_commit.message, '[release]') }}
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write
      id-token: write
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      VSCE_PAT: ${{ secrets.VSCE_PAT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run Python Semantic Release
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "github-actions[bot]@users.noreply.github.com"
        run: |
          uvx --with "gitpython<3.1.44" python-semantic-release version

      - name: Build sdist and wheel
        run: |
          mkdir -p dist dist-python
          uv build --out-dir dist-python
          cp dist-python/* dist/

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "extensions/vscode/package-lock.json"

      - name: Build and Package VS Code Extension (.vsix)
        run: |
          mkdir -p dist
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "Building VS Code extension matching PyPI package version: $PKG_VERSION"
          cd extensions/vscode
          npm version "$PKG_VERSION" --no-git-tag-version --allow-same-version
          npm ci
          npm run build
          npx @vscode/vsce package --no-dependencies -o ../../dist/kubelings-vscode.vsix

      - name: Upload Artifacts to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git fetch --tags
          LATEST_TAG=$(git describe --tags --abbrev=0 || echo "")
          if [ -n "$LATEST_TAG" ]; then
            echo "Attaching build artifacts to release $LATEST_TAG"
            gh release upload "$LATEST_TAG" dist/* --clobber || true
          fi

      - name: Publish to PyPI
        if: ${{ env.PYPI_API_TOKEN != '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-python/
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

      - name: Publish to VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: |
          cd extensions/vscode
          npx @vscode/vsce publish --no-dependencies --skip-duplicate -p "$VSCE_PAT"
