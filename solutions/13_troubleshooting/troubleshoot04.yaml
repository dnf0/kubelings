# Exercise: solutions/13_troubleshooting/troubleshoot04.yaml
# Topic: ResourceQuotas & LimitRanges
#
# Reference Solution

apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-quota
  namespace: team-billing
spec:
  hard:
    requests.cpu: "4"
    requests.memory: "8Gi"
    limits.cpu: "8"
    limits.memory: "16Gi"
    pods: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: container-limits
  namespace: team-billing
spec:
  limits:
  - type: Container
    default:
      cpu: "500m"
      memory: "512Mi"
    defaultRequest:
      cpu: "200m"
      memory: "256Mi"
    max:
      cpu: "2"
      memory: "2Gi"
    min:
      cpu: "100m"
      memory: "128Mi"
