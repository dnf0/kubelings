# Exercise: solutions/13_troubleshooting/troubleshoot01.yaml
# Topic: Debugging CrashLoopBackOff & Exit Codes
# Reference Guide: https://dnf0.github.io/kubelings/guides/13-troubleshooting/
#
# Reference Solution

apiVersion: v1
kind: Pod
metadata:
  name: crasher-pod-fixed
  namespace: troubleshoot
spec:
  containers:
  - name: api-server
    image: nginx:alpine
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    env:
    - name: DATABASE_URL
      value: postgres://db.internal:5432/app
