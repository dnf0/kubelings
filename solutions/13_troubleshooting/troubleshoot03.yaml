# Exercise: solutions/13_troubleshooting/troubleshoot03.yaml
# Topic: Debugging Pending Pods & Scheduling Failures
#
# Reference Solution

apiVersion: v1
kind: Pod
metadata:
  name: gpu-worker
  namespace: ml-workloads
spec:
  nodeSelector:
    node-type: gpu-compute-node
  tolerations:
  - key: sku
    operator: Equal
    value: gpu-worker
    effect: NoSchedule
  containers:
  - name: trainer
    image: nvidia/cuda:12.2.0-base-ubuntu22.04
    resources:
      requests:
        cpu: "1"
        memory: "2Gi"
