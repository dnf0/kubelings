# Exercise: solutions/02_controllers/ctrl01.yaml
# Topic: ReplicaSets & Label Selectors
#
# Reference Solution

apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: frontend-rs
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend
      env: prod
  template:
    metadata:
      labels:
        app: frontend
        env: prod
    spec:
      containers:
      - name: web
        image: nginx:alpine
