# Exercise: solutions/03_config_secrets/config01.yaml
# Topic: ConfigMaps as Environment Variables
# Reference Guide: https://dnf0.github.io/kubelings/guides/03-config-secrets/
#
# Reference Solution

apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  APP_ENV: production
  DATABASE_HOST: postgres.internal
  PORT: "8080"
---
apiVersion: v1
kind: Pod
metadata:
  name: app-pod
spec:
  containers:
  - name: backend
    image: python:3.12-alpine
    envFrom:
    - configMapRef:
        name: app-config
    env:
    - name: CUSTOM_PORT
      valueFrom:
        configMapKeyRef:
          name: app-config
          key: PORT
