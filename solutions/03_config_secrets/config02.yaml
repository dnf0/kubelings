# Exercise: solutions/03_config_secrets/config02.yaml
# Topic: ConfigMaps Mounted as Volumes & subPath
#
# Reference Solution

apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  default.conf: "server { listen 80; server_name localhost; }"
---
apiVersion: v1
kind: Pod
metadata:
  name: nginx-configured
spec:
  volumes:
  - name: config-vol
    configMap:
      name: nginx-config
  containers:
  - name: nginx-server
    image: nginx:alpine
    volumeMounts:
    - name: config-vol
      mountPath: /etc/nginx/conf.d/default.conf
      subPath: default.conf
