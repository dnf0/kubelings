apiVersion: v1
kind: ServiceAccount
metadata:
  name: s3-reader-sa
  namespace: default
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/s3-reader-role
---
apiVersion: v1
kind: Pod
metadata:
  name: s3-worker-pod
  namespace: default
spec:
  serviceAccountName: s3-reader-sa
  containers:
    - name: worker
      image: amazon/aws-cli:latest
      command: ["aws", "s3", "ls"]
