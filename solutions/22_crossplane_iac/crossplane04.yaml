# Solution: crossplane04.yaml
# Topic: Crossplane - Developer Self-Service Claims and Connection Secrets
# Reference Guide: https://dnf0.github.io/kubelings/guides/22-crossplane-iac/

apiVersion: database.kubelings.io/v1alpha1
kind: PostgreSQLInstance
metadata:
  name: production-postgres-claim
  namespace: production
spec:
  parameters:
    storageGB: 100
    engineVersion: '16.1'
  compositionSelector:
    matchLabels:
      provider: aws
      db: postgres
  writeConnectionSecretToRef:
    name: production-postgres-conn
