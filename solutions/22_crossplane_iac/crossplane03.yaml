# Solution: crossplane03.yaml
# Topic: Crossplane - ProviderConfig and Resource Deletion Policies
# Reference Guide: https://dnf0.github.io/kubelings/guides/22-crossplane-iac/

apiVersion: aws.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: default-aws-provider
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: aws-credentials
      key: creds

---
apiVersion: s3.aws.upbound.io/v1beta1
kind: Bucket
metadata:
  name: app-assets-bucket
spec:
  providerConfigRef:
    name: default-aws-provider
  deletionPolicy: Delete
