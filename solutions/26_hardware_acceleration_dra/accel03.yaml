# Solution: solutions/26_hardware_acceleration_dra/accel03.yaml
# Topic: Kubernetes Dynamic Resource Allocation (DRA) Standard
# Reference Guide: https://dnf0.github.io/kubelings/guides/26-hardware-acceleration-dra/

apiVersion: resource.k8s.io/v1alpha3
kind: ResourceClaimTemplate
metadata:
  name: gpu-dra-claim-template
spec:
  spec:
    devices:
      requests:
        - name: dedicated-gpu
          deviceClassName: gpu.example.com
          count: 1
---
apiVersion: v1
kind: Pod
metadata:
  name: dra-workload-pod
spec:
  resourceClaims:
    - name: gpu-claim
      resourceClaimTemplateName: gpu-dra-claim-template
  containers:
    - name: workload
      image: ubuntu:22.04
      resources:
        claims:
          - name: gpu-claim
