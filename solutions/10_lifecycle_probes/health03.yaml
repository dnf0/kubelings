# Exercise: solutions/10_lifecycle_probes/health03.yaml
# Topic: Startup Probes
# Reference Guide: https://dnf0.github.io/kubelings/guides/10-lifecycle-probes/
#
# Reference Solution

apiVersion: v1
kind: Pod
metadata:
  name: legacy-app-pod
spec:
  containers:
  - name: legacy-app
    image: openjdk:21-slim
    startupProbe:
      tcpSocket:
        port: 8080
      initialDelaySeconds: 10
      periodSeconds: 10
      failureThreshold: 30
    livenessProbe:
      httpGet:
        path: /alive
        port: 8080
      periodSeconds: 10
      failureThreshold: 3
