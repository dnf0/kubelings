# Solution: tetragon02.yaml
# Topic: eBPF Observability - Tetragon File and Token Access Monitoring

apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: monitor-sensitive-file-access
spec:
  kprobes:
  - call: sys_openat
    syscall: true
    args:
    - index: 0
      type: int
    - index: 1
      type: string
    selectors:
    - matchArgs:
      - index: 1
        operator: Prefix
        values:
        - /etc/shadow
        - /var/run/secrets/kubernetes.io
