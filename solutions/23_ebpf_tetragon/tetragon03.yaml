# Solution: tetragon03.yaml
# Topic: eBPF Security - Real-Time Kernel Enforcement and Sigkill Actions

apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: block-privilege-escalation
spec:
  kprobes:
  - call: sys_execve
    syscall: true
    args:
    - index: 0
      type: string
    selectors:
    - matchArgs:
      - index: 0
        operator: Exact
        values:
        - /usr/bin/sudo
        - /usr/bin/su
        - /usr/bin/nsenter
      matchActions:
      - action: Sigkill
