apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-worker
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: analytics-worker
  template:
    metadata:
      labels:
        app: analytics-worker
      annotations:
        autopilot.gke.io/compute-class: Performance
    spec:
      containers:
        - name: processor
          image: python:3.12-slim
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
            limits:
              cpu: "2"
              memory: 8Gi
