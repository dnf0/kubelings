# Solution: solutions/25_batch_kueue_volcano/kueue01.yaml
# Topic: Kueue ResourceFlavor & ClusterQueue Cohort Borrowing
# Reference Guide: https://dnf0.github.io/kubelings/guides/25-batch-kueue-volcano/

apiVersion: kueue.x-k8s.io/v1beta1
kind: ResourceFlavor
metadata:
  name: default-flavor
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: ClusterQueue
metadata:
  name: cluster-queue-ai
spec:
  cohort: ai-research-cohort
  resourceGroups:
    - coveredResources:
        - cpu
        - memory
        - nvidia.com/gpu
      flavors:
        - name: default-flavor
          resources:
            - name: cpu
              nominalQuota: "64"
              borrowingLimit: "32"
            - name: memory
              nominalQuota: 256Gi
            - name: nvidia.com/gpu
              nominalQuota: "8"
              borrowingLimit: "4"
