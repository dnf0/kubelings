# Exercise: solutions/05_services_networking/net03.yaml
# Topic: NodePort & LoadBalancer Service Types
# Reference Guide: https://dnf0.github.io/kubelings/guides/05-services-networking/
#
# Reference Solution

apiVersion: v1
kind: Service
metadata:
  name: frontend-np
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 80
    nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-lb
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
  - name: https
    protocol: TCP
    port: 443
    targetPort: 8443
  loadBalancerSourceRanges:
    - 192.168.0.0/16
    - 10.0.0.0/8
