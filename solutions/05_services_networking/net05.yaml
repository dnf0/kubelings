# Reference Solution

apiVersion: v1
kind: Service
metadata:
  name: external-database
spec:
  type: ExternalName
  externalName: db.production.aws.rds.com
---
apiVersion: v1
kind: Service
metadata:
  name: legacy-crm
spec:
  ports:
  - name: http
    port: 80
    targetPort: 8080
---
apiVersion: v1
kind: Endpoints
metadata:
  name: legacy-crm
subsets:
- addresses:
  - ip: 10.240.0.15
  - ip: 10.240.0.16
  ports:
  - name: http
    port: 8080
