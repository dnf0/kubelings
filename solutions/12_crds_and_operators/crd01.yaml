# Exercise: solutions/12_crds_and_operators/crd01.yaml
# Topic: CustomResourceDefinition (CRD) Schema
# Reference Guide: https://dnf0.github.io/kubelings/guides/12-crds-and-operators/
#
# Reference Solution

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: databases.database.example.com
spec:
  group: database.example.com
  scope: Namespaced
  names:
    plural: databases
    singular: database
    kind: Database
    shortNames:
    - db
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
            - engine
            - version
            - replicas
            properties:
              engine:
                type: string
                enum:
                - postgres
                - mysql
                - redis
              version:
                type: string
              replicas:
                type: integer
                minimum: 1
                maximum: 5
              storageGB:
                type: integer
                minimum: 10
