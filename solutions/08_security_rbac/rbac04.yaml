# Exercise: solutions/08_security_rbac/rbac04.yaml
# Topic: Pod & Container SecurityContext
# Reference Guide: https://dnf0.github.io/kubelings/guides/08-security-rbac/
#
# Reference Solution

apiVersion: v1
kind: Pod
metadata:
  name: secure-app-pod
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 20001
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: secure-app
    image: alpine:3.19
    command: ["sh", "-c", "echo Security context applied && sleep 3600"]
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
        add:
        - NET_BIND_SERVICE
