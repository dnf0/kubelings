# Topic: Gateway API Fundamentals
# Reference Guide: https://dnf0.github.io/kubelings/guides/06-ingress-gateway/
#
# Reference Solution

apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: prod-edge-gw
spec:
  gatewayClassName: envoy-gateway
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: orders-traffic-route
spec:
  parentRefs:
  - name: prod-edge-gw
  hostnames:
  - orders.production.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /orders
    backendRefs:
    - name: orders-v1
      port: 8080
      weight: 90
    - name: orders-v2-canary
      port: 8080
      weight: 10
