# Chapter 17: Multi-Tenancy, Virtual Clusters & HNC
# Exercise 17.3: Virtual Cluster (vcluster) Control Plane Manifest (Solution)

apiVersion: vcluster.loft.sh/v1alpha1
kind: VirtualCluster
metadata:
  name: dev-vcluster
  namespace: team-c
spec:
  distro:
    k3s:
      enabled: true
  sync:
    toHost:
      ingresses:
        enabled: true
      services:
        enabled: true
    fromHost:
      nodes:
        enabled: true
