# Exercise: solutions/04_storage/storage03.yaml
# Topic: Access Modes & Reclaim Policies
# Reference Guide: https://dnf0.github.io/kubelings/guides/04-storage/
#
# Reference Solution

apiVersion: v1
kind: PersistentVolume
metadata:
  name: shared-nfs-pv
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteMany
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-storage
  nfs:
    server: 10.0.0.100
    path: /exports/shared
