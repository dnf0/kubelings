<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&amp;display=swap');
      
      .terminal-window {
        fill: #0d1117;
        stroke: #30363d;
        stroke-width: 1.5;
        rx: 10;
        ry: 10;
      }
      .terminal-header {
        fill: #161b22;
        rx: 10;
        ry: 10;
      }
      .header-title {
        fill: #8b949e;
        font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 13px;
        font-weight: 500;
        text-anchor: middle;
      }
      .circle-red { fill: #ff5f56; }
      .circle-yellow { fill: #ffbd2e; }
      .circle-green { fill: #27c93f; }
      
      .term-text {
        font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 13px;
        line-height: 20px;
      }
      
      .c-dim { fill: #8b949e; }
      .c-white { fill: #f0f6fc; }
      .c-cyan { fill: #58a6ff; font-weight: 600; }
      .c-blue { fill: #79c0ff; }
      .c-green { fill: #3fb950; font-weight: 600; }
      .c-red { fill: #f85149; font-weight: 600; }
      .c-yellow { fill: #d29922; font-weight: 600; }
      .c-purple { fill: #bc8cff; font-weight: 600; }
      
      .frame {
        opacity: 0;
        animation: cycle 14s infinite ease-in-out;
      }
      
      /* Frame 1: kubelings tour (0s -> 3.5s) */
      .frame-1 {
        animation-name: anim-frame-1;
      }
      /* Frame 2: kubelings watch fail (3.5s -> 7s) */
      .frame-2 {
        animation-name: anim-frame-2;
      }
      /* Frame 3: watch hint reveal (7s -> 10s) */
      .frame-3 {
        animation-name: anim-frame-3;
      }
      /* Frame 4: watch pass on-save (10s -> 14s) */
      .frame-4 {
        animation-name: anim-frame-4;
      }

      @keyframes anim-frame-1 {
        0%, 2% { opacity: 0; }
        4%, 23% { opacity: 1; }
        25%, 100% { opacity: 0; }
      }
      @keyframes anim-frame-2 {
        0%, 25% { opacity: 0; }
        27%, 48% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes anim-frame-3 {
        0%, 50% { opacity: 0; }
        52%, 73% { opacity: 1; }
        75%, 100% { opacity: 0; }
      }
      @keyframes anim-frame-4 {
        0%, 75% { opacity: 0; }
        77%, 97% { opacity: 1; }
        99%, 100% { opacity: 0; }
      }

      .cursor {
        animation: blink 0.8s infinite;
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Terminal Window Background -->
  <rect x="10" y="10" width="860" height="480" class="terminal-window" />
  
  <!-- Terminal Header Bar -->
  <path d="M 10 20 Q 10 10 20 10 L 860 10 Q 870 10 870 20 L 870 45 L 10 45 Z" class="terminal-header" />
  <line x1="10" y1="45" x2="870" y2="45" stroke="#30363d" stroke-width="1" />
  
  <!-- Traffic Light Window Buttons -->
  <circle cx="32" cy="28" r="6" class="circle-red" />
  <circle cx="52" cy="28" r="6" class="circle-yellow" />
  <circle cx="72" cy="28" r="6" class="circle-green" />
  
  <!-- Header Title -->
  <text x="440" y="32" class="header-title">zsh — kubelings — 80×24</text>

  <!-- ================= FRAME 1: KUBELINGS TOUR ================= -->
  <g class="frame frame-1">
    <text x="35" y="80" class="term-text c-dim">$ <tspan class="c-white">uvx kubelings tour</tspan></text>
    
    <text x="35" y="115" class="term-text c-cyan">┌────────────────────────────────────────────────────────────────────────────┐</text>
    <text x="35" y="135" class="term-text c-cyan">│ <tspan class="c-white">☸️  KUBELINGS INTERACTIVE ONBOARDING TOUR</tspan> <tspan class="c-dim">(Step 1 of 5)</tspan>                     │</text>
    <text x="35" y="155" class="term-text c-cyan">├────────────────────────────────────────────────────────────────────────────┤</text>
    <text x="35" y="180" class="term-text c-white">  Welcome to <tspan class="c-purple">Kubelings</tspan>! Master Kubernetes through test-driven micro-exercises.</text>
    <text x="35" y="205" class="term-text c-dim">  • Fast client-side AST validation engine (<tspan class="c-green">&lt;15ms feedback loop</tspan>)</text>
    <text x="35" y="225" class="term-text c-dim">  • Dual-mode verification (100% offline cluster-less OR live cluster)</text>
    <text x="35" y="245" class="term-text c-dim">  • 26 Chapters, 114 Exercises (Core Workloads ➔ KubeRay ➔ Apple Silicon GPU)</text>
    <text x="35" y="275" class="term-text c-yellow">  Next step: Checking your local development environment &amp; cluster capabilities...</text>
    <text x="35" y="305" class="term-text c-cyan">└────────────────────────────────────────────────────────────────────────────┘</text>
    
    <text x="35" y="340" class="term-text c-dim">Press <tspan class="c-white">[Enter]</tspan> to continue to Step 2 (Environment Diagnostics) <tspan class="c-cyan cursor">▌</tspan></text>
  </g>

  <!-- ================= FRAME 2: KUBELINGS WATCH FAIL ================= -->
  <g class="frame frame-2">
    <text x="35" y="80" class="term-text c-dim">$ <tspan class="c-white">kubelings watch</tspan></text>
    
    <text x="35" y="115" class="term-text c-blue">┌────────────────────────────────────────────────────────────────────────────┐</text>
    <text x="35" y="135" class="term-text c-blue">│ ☸️  <tspan class="c-white">KUBELINGS WATCH MODE</tspan> │ Chapter 01: Pods │ <tspan class="c-yellow">pods01.py</tspan> │ <tspan class="c-dim">[██░░░░░░░░] 1/114</tspan> │</text>
    <text x="35" y="155" class="term-text c-blue">├────────────────────────────────────────────────────────────────────────────┤</text>
    <text x="35" y="180" class="term-text c-red">  ❌ EVALUATION FAILED (12.4ms)</text>
    <text x="35" y="210" class="term-text c-dim">  ── Schema Diagnostics ─────────────────────────────────────────────────────</text>
    <text x="35" y="235" class="term-text c-white">  • Pod '<tspan class="c-yellow">nginx-web</tspan>' container '<tspan class="c-yellow">nginx</tspan>' is missing <tspan class="c-red">containerPort: 80</tspan></text>
    <text x="35" y="255" class="term-text c-white">  • Expected metadata label: <tspan class="c-red">'app': 'web'</tspan></text>
    <text x="35" y="285" class="term-text c-dim">  ── Hint Status ────────────────────────────────────────────────────────────</text>
    <text x="35" y="310" class="term-text c-dim">  Press <tspan class="c-yellow">[h]</tspan> to reveal Tier 1 Hint</text>
    <text x="35" y="335" class="term-text c-blue">├────────────────────────────────────────────────────────────────────────────┤</text>
    <text x="35" y="355" class="term-text c-dim">│ Hotkeys: <tspan class="c-white">[n]</tspan> Next  <tspan class="c-white">[p]</tspan> Prev  <tspan class="c-yellow">[h]</tspan> Hint  <tspan class="c-white">[l]</tspan> Diff Solution  <tspan class="c-white">[r]</tspan> Rerun  <tspan class="c-white">[q]</tspan> Quit │</text>
    <text x="35" y="375" class="term-text c-blue">└────────────────────────────────────────────────────────────────────────────┘</text>
    <text x="35" y="410" class="term-text c-dim">Watching <tspan class="c-white">exercises/01_pods/pods01.py</tspan> for file changes... <tspan class="c-cyan cursor">▌</tspan></text>
  </g>

  <!-- ================= FRAME 3: WATCH HINT REVEAL ================= -->
  <g class="frame frame-3">
    <text x="35" y="80" class="term-text c-dim">$ <tspan class="c-white">kubelings watch</tspan> <tspan class="c-dim">[user pressed 'h']</tspan></text>
    
    <text x="35" y="115" class="term-text c-blue">┌────────────────────────────────────────────────────────────────────────────┐</text>
    <text x="35" y="135" class="term-text c-blue">│ ☸️  <tspan class="c-white">KUBELINGS WATCH MODE</tspan> │ Chapter 01: Pods │ <tspan class="c-yellow">pods01.py</tspan> │ <tspan class="c-dim">[██░░░░░░░░] 1/114</tspan> │</text>
    <text x="35" y="155" class="term-text c-blue">├────────────────────────────────────────────────────────────────────────────┤</text>
    <text x="35" y="180" class="term-text c-red">  ❌ EVALUATION FAILED (12.4ms)</text>
    <text x="35" y="210" class="term-text c-dim">  ── Schema Diagnostics ─────────────────────────────────────────────────────</text>
    <text x="35" y="235" class="term-text c-white">  • Pod '<tspan class="c-yellow">nginx-web</tspan>' container '<tspan class="c-yellow">nginx</tspan>' is missing <tspan class="c-red">containerPort: 80</tspan></text>
    <text x="35" y="255" class="term-text c-white">  • Expected metadata label: <tspan class="c-red">'app': 'web'</tspan></text>
    <text x="35" y="285" class="term-text c-yellow">  ── Hint (Tier 1 of 3) ─────────────────────────────────────────────────────</text>
    <text x="35" y="310" class="term-text c-yellow">  💡 Check <tspan class="c-white">spec.containers[0].ports</tspan> and define a list with <tspan class="c-green">containerPort: 80</tspan>.</text>
    <text x="35" y="335" class="term-text c-blue">├────────────────────────────────────────────────────────────────────────────┤</text>
    <text x="35" y="355" class="term-text c-dim">│ Hotkeys: <tspan class="c-white">[n]</tspan> Next  <tspan class="c-white">[p]</tspan> Prev  <tspan class="c-yellow">[h]</tspan> Next Hint  <tspan class="c-white">[l]</tspan> Diff Solution  <tspan class="c-white">[r]</tspan> Rerun │</text>
    <text x="35" y="375" class="term-text c-blue">└────────────────────────────────────────────────────────────────────────────┘</text>
    <text x="35" y="410" class="term-text c-dim">Edit &amp; save <tspan class="c-white">pods01.py</tspan> to re-evaluate... <tspan class="c-green cursor">▌</tspan></text>
  </g>

  <!-- ================= FRAME 4: ON-SAVE PASS ================= -->
  <g class="frame frame-4">
    <text x="35" y="80" class="term-text c-dim">$ <tspan class="c-white">kubelings watch</tspan> <tspan class="c-green">[file saved — re-evaluated in 11.2ms]</tspan></text>
    
    <text x="35" y="115" class="term-text c-green">┌────────────────────────────────────────────────────────────────────────────┐</text>
    <text x="35" y="135" class="term-text c-green">│ ☸️  <tspan class="c-white">KUBELINGS WATCH MODE</tspan> │ Chapter 01: Pods │ <tspan class="c-green">pods01.py ✓</tspan> │ <tspan class="c-green">[████░░░░░░] 2/114</tspan> │</text>
    <text x="35" y="155" class="term-text c-green">├────────────────────────────────────────────────────────────────────────────┤</text>
    <text x="35" y="180" class="term-text c-green">  ✅ SUCCESS! Exercise pods01 passed all schema and manifest validations!</text>
    <text x="35" y="210" class="term-text c-dim">  ── Verification Details ───────────────────────────────────────────────────</text>
    <text x="35" y="235" class="term-text c-white">  ✓ Pod metadata valid (<tspan class="c-green">name: nginx-web, labels: {app: web}</tspan>)</text>
    <text x="35" y="255" class="term-text c-white">  ✓ Spec containers valid (<tspan class="c-green">nginx:alpine, containerPort: 80/TCP</tspan>)</text>
    <text x="35" y="280" class="term-text c-white">  ✓ Sub-15ms offline validation: <tspan class="c-cyan">11.2ms</tspan></text>
    <text x="35" y="310" class="term-text c-purple">  🚀 Moving to next exercise: <tspan class="c-white">pods02.py (Multi-Container Pod with Shared Volume)</tspan></text>
    <text x="35" y="335" class="term-text c-green">├────────────────────────────────────────────────────────────────────────────┤</text>
    <text x="35" y="355" class="term-text c-dim">│ Hotkeys: <tspan class="c-white">[n]</tspan> Next  <tspan class="c-white">[p]</tspan> Prev  <tspan class="c-white">[h]</tspan> Hint  <tspan class="c-white">[l]</tspan> Diff Solution  <tspan class="c-white">[r]</tspan> Rerun  <tspan class="c-white">[q]</tspan> Quit │</text>
    <text x="35" y="375" class="term-text c-green">└────────────────────────────────────────────────────────────────────────────┘</text>
    <text x="35" y="410" class="term-text c-dim">Watching <tspan class="c-white">exercises/01_pods/pods02.py</tspan>... <tspan class="c-green cursor">▌</tspan></text>
  </g>
</svg>
