  ingressClassName: ???
  rules:
  - host: api.example.com
    http:
      paths:
      - path: /v1
        # TODO: Set pathType to 'Prefix' and backend service to 'api-v1-service' on port 80
        # WHY: Prefix matching routes all subpaths starting with /v1 to the v1 backend service.
        pathType: ???
        backend:
          service:
            name: ???
            port:
              number: 80
      - path: /v2
        pathType: Prefix
        backend:
