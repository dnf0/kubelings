# Context & Why:
# Google Config Connector (KCC) is a Kubernetes addon that lets you manage Google Cloud resources
# (such as Cloud Storage buckets, Cloud SQL instances, Spanner databases, IAM roles) declaratively
# through native Kubernetes manifests and CRDs.
#
# Task:
# Author a `StorageBucket` CRD to declaratively provision a Google Cloud Storage bucket:
# 1. Set 'apiVersion' to 'storage.cnrm.cloud.google.com/v1beta1' and 'kind' to 'StorageBucket'.
# 2. Set 'metadata.name' to 'prod-analytics-archive-bucket' in namespace 'default'.
# 3. Add annotation 'cnrm.cloud.google.com/deletion-policy: abandon'.
# 4. Under 'spec.location', set 'US-CENTRAL1'.
# 5. Set 'spec.storageClass' to 'STANDARD'.
# 6. Set 'spec.uniformBucketLevelAccess' to true.
# 7. Set 'spec.versioning.enabled' to true.

