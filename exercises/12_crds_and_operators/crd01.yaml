#    - spec:
#      - group: 'database.example.com'
#      - scope: 'Namespaced'
#      - names:
#        - plural: 'databases'
#        - singular: 'database'
#        - kind: 'Database'
#        - shortNames: ['db']
#      - versions:
#        - name: 'v1alpha1'
#          served: true
#          storage: true
#          schema:
#            openAPIV3Schema:
#              type: object
#              properties:
#                spec:
#                  type: object
#                  required: ['engine', 'version', 'replicas']
#                  properties:
#                    engine:
#                      type: string
#                      enum: ['postgres', 'mysql', 'redis']
#                    version:
