# 2. kind: "CiliumNetworkPolicy"
# 3. metadata:
#    - name: "secure-api-l7"
# 4. spec:
#    - endpointSelector:
#      - matchLabels:
#        - app: "secure-backend"
#    - ingress:
#      - fromEndpoints:
#        - matchLabels:
#          - app: "frontend"
#      - toPorts:
