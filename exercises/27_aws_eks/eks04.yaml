  name: ???
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: ???
      requirements:
        - key: karpenter.sh/capacity-type
          operator: ???
          values:
            - ???
        - key: karpenter.k8s.aws/instance-family
          operator: ???
          values:
            - ???
  limits:
    cpu: ???
    memory: ???
---
apiVersion: ???
kind: EC2NodeClass
metadata:
  name: ???
spec:
  amiFamily: ???
  role: ???
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: my-cluster
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: my-cluster
